spring:
  application:
    name: kinship
  datasource:
    url: jdbc:h2:mem:kinship;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  liquibase:
    enabled: false
  docker:
    compose:
      enabled: false

kinship:
  neo4j:
    data-directory: ./data/neo4j
    bolt-port: 7687
